<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sands Tech — الجدار الكامل</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --wall: #1a1410;
      --ink: #1c1917;
      --cream: #f6f1e6;
      --muted: #78716c;
      --line: rgba(255,255,255,.14);
      --amber: #fbbf24;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(255,236,200,.08), transparent 28%),
        radial-gradient(circle at 100% 80%, rgba(0,0,0,.45), transparent 36%),
        repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
        var(--wall);
      color: var(--cream);
      min-height: 100vh;
    }
    .ltr { direction: ltr; unicode-bidi: isolate; }
    .mono { font-family: "IBM Plex Mono", Consolas, monospace; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
    .wrap { width: min(1440px, calc(100% - 28px)); margin: 0 auto; }

    .top {
      display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
      padding: 22px 0 8px;
    }
    .eyebrow { margin: 0; color: #d6d3d1; font-size: 12px; letter-spacing: .04em; }
    h1 { margin: 4px 0 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.15; }
    .side-mark { text-align: left; color: #d6d3d1; font-size: 12px; }
    .side-mark strong { display: block; color: var(--cream); font-size: 13px; letter-spacing: .14em; }

    .originals {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin: 16px 0 8px;
    }
    .polaroid {
      background: #f7f3ea;
      color: var(--ink);
      padding: 10px 10px 12px;
      border-radius: 3px;
      box-shadow: 0 14px 26px rgba(0,0,0,.38);
    }
    .polaroid:nth-child(1) { transform: rotate(-1.2deg); }
    .polaroid:nth-child(2) { transform: rotate(.7deg); }
    .polaroid:nth-child(3) { transform: rotate(-.4deg); }
    .polaroid.is-on { outline: 3px solid var(--amber); }
    .polaroid img { width: 100%; height: 168px; object-fit: cover; object-position: top; display: block; background: #111; }
    .polaroid .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
    .polaroid h2 { margin: 0; font-size: 14px; }
    .polaroid p { margin: 2px 0 0; color: #57534e; font-size: 11px; }
    .ghost, .solid {
      border-radius: 999px; border: 1px solid #d6d3d1; background: transparent;
      padding: 4px 10px; font-size: 12px; font-weight: 700;
    }
    .solid { background: var(--ink); color: white; border-color: var(--ink); }
    .zoom {
      display: block; width: 100%; padding: 0; border: 0; background: transparent;
    }

    .bar {
      position: sticky; top: 0; z-index: 30;
      background: rgba(26,20,16,.94);
      backdrop-filter: blur(12px);
      padding: 10px 0 12px;
      border-bottom: 1px solid var(--line);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .chip {
      border: 1px solid var(--line); background: transparent; color: #f5e6c8;
      border-radius: 999px; padding: 6px 11px; font-size: 13px; font-weight: 600;
    }
    .chip[aria-pressed="true"] { background: var(--amber); color: var(--ink); border-color: var(--amber); }
    .chip b { font-weight: 700; margin-inline-start: 4px; }
    .tools { display: flex; gap: 8px; align-items: center; }
    .tools input {
      flex: 1; min-width: 0;
      background: rgba(255,255,255,.06); color: white;
      border: 1px solid var(--line); border-radius: 999px;
      padding: 8px 14px;
    }
    .tools input::placeholder { color: #a8a29e; }
    #count { margin: 8px 0 0; color: #d6d3d1; font-size: 13px; }

    .wall {
      columns: 4 270px;
      column-gap: 14px;
      padding: 16px 0 48px;
      scroll-margin-top: 140px;
    }
    .card {
      break-inside: avoid;
      margin: 0 0 14px;
      background: white;
      color: var(--ink);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 18px rgba(0,0,0,.28);
      position: relative;
    }
    .card:nth-child(6n+1) { transform: rotate(-.7deg); }
    .card:nth-child(6n+2) { transform: rotate(.55deg); }
    .card:nth-child(6n+4) { transform: rotate(-.4deg); }
    .card:nth-child(6n+5) { transform: rotate(.8deg); }
    .card:hover { transform: rotate(0deg) translateY(-2px); z-index: 2; }
    .card:nth-child(5n)::before {
      content: "";
      position: absolute; top: -7px; inset-inline-start: 22%;
      width: 54px; height: 14px; z-index: 2;
      background: rgba(232, 208, 122, .72);
      transform: rotate(-8deg);
      pointer-events: none;
    }
    .mild { outline: 1px dashed rgba(234, 88, 12, .55); outline-offset: -3px; }
    .hd { display: flex; gap: 8px; align-items: center; padding: 8px 10px 4px; }
    .ava {
      width: 30px; height: 30px; border-radius: 50%; flex: none;
      display: grid; place-items: center; color: white; font-size: 12px; font-weight: 700;
    }
    .who { font-weight: 700; font-size: 13px; line-height: 1.25; }
    .sub { color: var(--muted); font-size: 11px; line-height: 1.35; }
    .src {
      display: inline-block; margin-inline-start: 4px;
      border-radius: 99px; padding: 0 6px; font-size: 10px; font-weight: 700;
    }
    .src-wall { background: #fef3c7; color: #92400e; }
    .src-feedback { background: #e0f2fe; color: #075985; }
    .src-love { background: #ffe4e6; color: #9f1239; }
    .cap { margin: 0; padding: 2px 10px 8px; font-size: 13.5px; line-height: 1.55; }
    .stat { padding: 0 10px 10px; color: #57534e; font-size: 12px; }
    .shot {
      height: 118px; margin: 2px 10px 8px; border-radius: 8px; position: relative;
    }
    .shot span, .badge {
      position: absolute; inset-inline-start: 8px; bottom: 8px;
      background: rgba(255,255,255,.92); color: var(--ink);
      font-size: 10px; font-weight: 800; letter-spacing: .04em;
      padding: 2px 7px; border-radius: 99px;
    }
    .ig .hd { box-shadow: inset 0 3px 0 #e1306c; }
    .story {
      min-height: 210px; padding: 12px; color: white;
      display: flex; flex-direction: column; justify-content: space-between; gap: 18px;
    }
    .story p { margin: 0; font-size: 20px; font-weight: 700; line-height: 1.35; }
    .pill {
      align-self: flex-start; background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,255,255,.45);
      border-radius: 99px; padding: 2px 8px; font-size: 12px; font-weight: 700;
    }
    .react { padding: 0 10px 10px; color: #57534e; font-size: 12px; }
    .stars { color: #f59e0b; letter-spacing: 1px; font-size: 14px; }
    .ghead, .store-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px 0; font-size: 12px; color: #444;
    }
    .rating { font-size: 28px; font-weight: 700; line-height: 1; }
    .review { border-top: 1px solid #f5f5f4; margin-top: 6px; padding-top: 6px; }
    .xcard { background: #0f1419; color: #e7e9ea; }
    .xcard .sub, .xcard .stat { color: #8b98a5; }
    .xcard .src-wall, .xcard .src-feedback, .xcard .src-love { color: inherit; }
    .tt-face {
      min-height: 220px; color: white; position: relative;
      display: flex; align-items: flex-end; padding: 12px;
    }
    .tt-face p { margin: 4px 0 0; font-size: 16px; font-weight: 700; line-height: 1.35; text-shadow: 0 1px 2px rgba(0,0,0,.45); }
    .tt-side {
      position: absolute; inset-inline-end: 10px; bottom: 46px;
      font-size: 12px; text-align: center; font-weight: 700;
    }
    .wa { background: #efeae2; }
    .bar-wa { background: #075e54; color: white; padding: 7px 10px; font-size: 12px; font-weight: 700; }
    .bar-wa small { display: block; font-weight: 500; opacity: .85; }
    .bub {
      margin: 8px; background: white; border-radius: 8px; padding: 7px 8px;
      font-size: 13px; line-height: 1.45;
    }
    .bub.me { background: #d9fdd3; }
    .bub time { display: block; text-align: left; color: #78716c; font-size: 10px; margin-top: 3px; }
    .wiki { background: #fffdf6; }
    .wiki h3 { margin: 10px 10px 0; font-size: 14px; }
    .empty {
      break-inside: avoid; column-span: all;
      padding: 28px 8px; color: #d6d3d1;
    }

    dialog {
      width: min(1100px, calc(100vw - 24px));
      max-height: calc(100vh - 24px);
      border: 0; padding: 0; background: transparent; color: white;
    }
    dialog::backdrop { background: rgba(0,0,0,.82); }
    dialog img {
      width: 100%; height: auto; max-height: calc(100vh - 72px);
      object-fit: contain; border-radius: 8px; display: block; background: #111;
    }
    dialog form { display: flex; justify-content: flex-end; margin-bottom: 8px; }
    dialog button {
      background: white; color: var(--ink); border: 0; border-radius: 999px;
      padding: 6px 12px; font-weight: 700;
    }

    @media (max-width: 800px) {
      .originals { grid-template-columns: 1fr; }
      .polaroid, .polaroid:nth-child(n) { transform: none; }
      .top { flex-direction: column; align-items: flex-start; }
      .side-mark { text-align: right; }
      .card, .card:hover { transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .card:hover, .polaroid { transform: none; }
    }
    @media print {
      body { background: white; color: black; }
      .bar, .zoom, .solid, .ghost, dialog { display: none !important; }
      .card { break-inside: avoid; box-shadow: none; border: 1px solid #ddd; transform: none !important; }
      .card::before { display: none; }
    }
  </style>
</head>

      if (c.k === "wa") {
        var bubbles = c.messages.map(function (m) {
          return '<div class="bub' + (m.me ? " me" : "") + d(m.text) + '">' + esc(m.text) + '<time class="ltr">' + esc(m.time) + "</time></div>";
        }).join("");
        return '<article class="card wa' + mild + '"><div class="bar-wa">' + esc(c.title) + "<small>" + esc(c.status) + " · " + BOARD_NAME[c.board] + "</small></div>" + bubbles + "</article>";
      }
      return '<article class="card wiki"><h3>' + esc(c.title) + " " + src(c.board) + '</h3><p class="cap' + d(c.cap) + '">' + esc(c.cap) + "</p></article>";
    }

    function matchBoard(c) {
      if (state.board !== "all" && c.board !== state.board) return false;
      if (state.q && blob(c).indexOf(state.q) === -1) return false;
      return true;
    }
    function match(c) {
      if (!matchBoard(c)) return false;
      if (state.plat !== "all" && c.k !== state.plat) return false;
      return true;
    }

    function inSearch(c) {
      return !state.q || blob(c).indexOf(state.q) !== -1;
    }
    function chips(host, items, key) {
      host.innerHTML = items.map(function (item) {
        var n = cards.filter(function (c) {
          if (!inSearch(c)) return false;
          if (key === "board") {
            if (state.plat !== "all" && c.k !== state.plat) return false;
            return item.k === "all" || c.board === item.k;
          }
          if (state.board !== "all" && c.board !== state.board) return false;
          return item.k === "all" || c.k === item.k;
        }).length;
        var on = state[key] === item.k;
        return '<button type="button" class="chip" data-key="' + key + '" data-val="' + item.k + '" aria-pressed="' + on + '">' + esc(item.t) + " <b>" + n + "</b></button>";
      }).join("");
    }

    function render() {
      var list = cards.filter(match);
      document.getElementById("wall").innerHTML = list.length
        ? list.map(card).join("")
        : '<p class="empty">ما في بطاقات بهالبحث. جرّب لوحة ثانية أو امسح الكلمة.</p>';
      var scope = cards.filter(matchBoard).length;
      document.getElementById("count").textContent = list.length + " بطاقة ظاهرة" + (state.q || state.board !== "all" || state.plat !== "all" ? " من " + cards.length : "");
      chips(document.getElementById("boardChips"), BOARDS, "board");
      chips(document.getElementById("platChips"), PLATS, "plat");
      ["wall", "feedback", "love"].forEach(function (b) {
        document.getElementById("pole-" + b).classList.toggle("is-on", state.board === b);
      });
      void scope;
    }

    document.getElementById("boardChips").addEventListener("click", onChip);
    document.getElementById("platChips").addEventListener("click", onChip);
    function onChip(e) {
      var b = e.target.closest("button");
      if (!b) return;
      state[b.dataset.key] = b.dataset.val;
      render();
    }
    document.getElementById("reset").addEventListener("click", function () {
      state.board = "all";
      state.plat = "all";
      state.q = "";
      render();
    });
    document.querySelectorAll("[data-board]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        state.board = btn.dataset.board;
        state.plat = "all";
        render();
        document.getElementById("wall").scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    var box = document.getElementById("lightbox");
    document.querySelectorAll("[data-zoom]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var img = document.getElementById("lightboxImg");
        img.src = btn.dataset.zoom;
        img.alt = btn.dataset.alt || "";
        box.showModal();
      });
    });
    box.addEventListener("click", function (e) {
      if (e.target === box) box.close();
    });

    render();
  </script>
</body>
</html>
